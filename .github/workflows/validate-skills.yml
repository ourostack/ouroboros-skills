name: Validate skills

on:
  pull_request:
  push:
    branches:
      - main

# A newer push to a pull request cancels its older run. Runs not triggered by a pull request each
# get their own group, so they are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate skills
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate skill repository
        run: node scripts/validate-skills.cjs

      - name: Validate skill eval contracts
        run: node scripts/test-skill-evals.cjs && node scripts/skill-evals.cjs validate
